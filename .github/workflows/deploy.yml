name: Test and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for GitHub OIDC -> AWS role
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node tests/test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync site to S3
        run: aws s3 sync frontend/ "s3://${{ vars.SITE_BUCKET }}" --delete --exclude test.html

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Smoke test
        run: |
          curl -fsS https://pomodorifi.es/ | grep -q "<title>Pomodorify</title>"
